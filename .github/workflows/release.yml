name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.2.0 (blank = use src-tauri/tauri.conf.json)"
        required: false
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false

# Read-only by default; each job below asks for what it needs.
permissions:
  contents: read

# Prevent a re-tag (or force-push of a tag) from stacking parallel release
# builds against the same ref. `cancel-in-progress: false` keeps a running
# release safe from accidental cancellation — a second tag with the same name
# just waits its turn instead of racing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve the version (input > tag > tauri.conf.json), validate it, and open a
  # DRAFT release that the publish job later fills.
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and set its notes
      checks: read # read main's CI results for this commit
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      release_id: ${{ steps.draft.outputs.release_id }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve + validate version
        id: resolve
        # Untrusted/manual inputs are passed via env (never interpolated into the
        # script) and the resolved version is regex-validated before any later use.
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          PRERELEASE_INPUT: ${{ github.event.inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${VERSION_INPUT:-}" ]; then
            V="$VERSION_INPUT"
          elif [ "$EVENT_NAME" = "push" ]; then
            V="${REF_NAME#v}"
          else
            V="$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$V' (expected semver like 1.2.3 or 1.2.3-rc.1)"
            exit 1
          fi
          PRE=false
          if [ "${PRERELEASE_INPUT:-false}" = "true" ] || printf '%s' "$V" | grep -Eq -- '-(alpha|beta|rc)'; then
            PRE=true
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$V prerelease=$PRE"

      # A release is built from a commit on main whose CI passed, however it was
      # started: a tag can sit on any commit and a manual run on any branch. If
      # CI has not finished, this stops the run; re-run it once CI is green. A run
      # started from a ref that edits this file can drop this step, which is what
      # the release environment's deployment rules are for. Any older commit of main
      # with green CI passes too, so a write-access holder can re-release old code.
      - name: Refuse a commit that is not on main with green CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GH_REPO/compare/main...$SHA" --jq .status)"
          gh api "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.app.slug == "github-actions") | [.name, (.conclusion // "")] | @tsv' > check-runs.tsv
          node scripts/release-gate.mjs "$status" check-runs.tsv

      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PRE_FLAG=""
          [ "$PRERELEASE" = "true" ] && PRE_FLAG="--prerelease"
          # Idempotent: create the draft (tagging $SHA on manual runs); if a release
          # for the tag already exists (re-run), just reuse it.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$SHA" \
              --draft \
              --title "Namehold $TAG" \
              --generate-notes \
              $PRE_FLAG
          fi
          # A published release stays as it is: this run would replace its files.
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ] || { echo "::error::$TAG is already published"; exit 1; }
          RID="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          echo "release_id=$RID" >> "$GITHUB_OUTPUT"

      - name: Set release notes from CHANGELOG.md
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # Extract the CHANGELOG.md section for this version:
          # - Match from "## [$VERSION]" to the next "## [" (or EOF).
          # - Print only the interior lines (skip the boundary headers).
          # - Trim leading blank lines.
          # A pre-release has no section of its own, so 1.2.3-rc.1 uses 1.2.3's.
          NOTES=""
          for ver in "$VERSION" "${VERSION%%-*}"; do
            NOTES="$(awk -v ver="$ver" '
              index($0, "## [" ver "]") == 1 { found=1; next }
              found && index($0, "## [") == 1 { exit }
              found { print }
            ' CHANGELOG.md | sed '/./,$!d')"
            [ -z "$NOTES" ] || break
          done
          if [ -z "$NOTES" ]; then
            # No CHANGELOG entry — fall back to the GitHub auto-generated notes
            # that `--generate-notes` produced when the draft was created. This
            # keeps `latest.json`'s `notes` field from ever being empty, which is
            # what silently hid the "What's new?" button in the update banner.
            echo "::warning::No CHANGELOG.md entry found for $VERSION — falling back to auto-generated release notes."
            NOTES="$(gh release view "$TAG" --json body --jq .body)"
          else
            echo "Setting release body from CHANGELOG.md ($VERSION):"
            echo "$NOTES" | head -5
            echo "..."
            # Write to a temp file to avoid shell quoting issues with special chars.
            printf '%s\n' "$NOTES" > /tmp/release-notes.md
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          fi
          # Expose the resolved notes to the publish job: they are the sole source
          # of `latest.json`'s `notes` field.
          {
            echo "release_notes<<NOTES_EOF"
            printf '%s\n' "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # Compiles with no signing key and no write token. A tauri build runs every
  # crate's build.rs and proc macros and the npm build tools, so none of that code
  # can reach the updater key or change the release. Nothing is restored from the
  # Actions cache either, because ci.yml and e2e.yml can write that cache on main
  # and restored objects would be linked in unchecked; a release build compiles
  # from scratch. scripts/check-supply-chain.mjs holds all of this in place.
  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: "--bundles nsis,updater"
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsecret-1-dev \
            libudev-dev patchelf build-essential libssl-dev mold xvfb

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head on 2026-10-16 (no version tags)
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.rust_targets }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On a manual run with a version override, sync it into the version files so
      # the produced bundles are named for the release. Version is pre-validated in
      # `prepare`; passed via env. jq is available on all GitHub-hosted runners.
      # Every cargo build below runs with --locked, which refuses a Cargo.lock that
      # no longer matches Cargo.toml. A version change moves exactly one entry of
      # it, the root package's (what cargo itself would rewrite), so that entry is
      # set here and every dependency stays at the version Cargo.lock pins.
      - name: Sync version files
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          current="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$current" = "$VERSION" ]; then
            echo "Version already $VERSION — no sync needed."
            exit 0
          fi
          echo "Syncing version $current -> $VERSION"
          tmp="$(mktemp)"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' package.json > "$tmp" && mv "$tmp" package.json
          # First [package] version key in Cargo.toml only.
          perl -0pi -e 's/^version = "[^"]*"/version = "'"$VERSION"'"/m if !$done++' src-tauri/Cargo.toml
          # The namehold-wallet entry of Cargo.lock; fails if there is none.
          perl -0pi -e '$n += s/(\[\[package\]\]\r?\nname = "namehold-wallet"\r?\nversion = )"[^"]*"/${1}"'"$VERSION"'"/; END { die "Cargo.lock has no namehold-wallet entry\n" unless $n }' src-tauri/Cargo.lock

      # Build the namehold-syncd daemon sidecar for bundling. Tauri's externalBin
      # expects `binaries/namehold-syncd-<target-triple>` in src-tauri/. For the
      # macOS universal build, we compile for both architectures and lipo them.
      - name: Build sidecar (macOS universal)
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: |
          set -euo pipefail
          mkdir -p binaries
          cargo build --locked --release --bin namehold-syncd --target aarch64-apple-darwin
          cargo build --locked --release --bin namehold-syncd --target x86_64-apple-darwin
          # Stage per-arch binaries for externalBin validation + resource bundling.
          cp target/aarch64-apple-darwin/release/namehold-syncd binaries/namehold-syncd-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/namehold-syncd binaries/namehold-syncd-x86_64-apple-darwin
          # cargo's build.rs leaves an empty 0644 placeholder at the staged path, and
          # cp onto an existing file keeps its mode: set the mode explicitly.
          chmod 0755 binaries/namehold-syncd-aarch64-apple-darwin binaries/namehold-syncd-x86_64-apple-darwin
          # externalBin resolves to `binaries/namehold-syncd-<target-triple>`; for a
          # universal build the triple is `universal-apple-darwin`, so stage a
          # lipo'd universal binary there too.
          lipo -create -output binaries/namehold-syncd-universal-apple-darwin \
            target/aarch64-apple-darwin/release/namehold-syncd \
            target/x86_64-apple-darwin/release/namehold-syncd
          # Tauri's universal bundler only lipos the main binary; additional [[bin]]
          # targets must be manually lipo'd into the universal output directory,
          # otherwise the .app bundling step fails to find `namehold-syncd` there.
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/namehold-syncd \
            target/aarch64-apple-darwin/release/namehold-syncd \
            target/x86_64-apple-darwin/release/namehold-syncd

      # Shared with appimage.yml, which builds the same AppImage on pull requests.
      - name: Build sidecar (Linux/Windows)
        if: matrix.platform != 'macos-latest'
        shell: bash
        run: bash scripts/stage-sidecar.sh

      # The bundler's AppRun launcher is 0770 (tauri-apps/tauri#16155); see the
      # script. Shared with appimage.yml.
      - name: Pre-seed the AppImage launcher (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/preseed-apprun.sh

      # --no-sign: tauri build otherwise refuses to finish without the private key,
      # because tauri.conf.json has a pubkey. It only skips signing: every updater
      # archive is still produced, and the sign job below signs what comes out. It
      # would also skip macOS and Windows code signing, which this build does not
      # do yet; adding that means revisiting this flag.
      - name: Build bundles
        shell: bash
        run: pnpm tauri build --no-sign ${{ matrix.args }} -- --locked

      # The AppImage runs as whoever mounted it, or as another user under firejail
      # and in the AppImage catalog's test: its file modes, its daemon and the app
      # itself are checked as another user (scripts/check-appimage.sh, also run by
      # appimage.yml on pull requests). A failure here stops the release in draft.
      - name: Check the AppImage runs for another user (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [ "${#images[@]}" -eq 1 ] || { echo "::error::expected one AppImage, found ${#images[@]}"; exit 1; }
          bash scripts/check-appimage.sh "${images[0]}"

      - name: Collect the release files
        run: node scripts/release-files.mjs stage src-tauri/target release-files

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-${{ matrix.platform }}
          path: release-files/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The only job that reads the updater signing secrets. It runs no third-party
  # action and no build: its one tool is the Tauri CLI, installed from the lockfile
  # in scripts/release-signer with install scripts off, and nothing it downloads is
  # executed. It has no write token. A compromised build can still get a bad bundle
  # signed here, but it cannot take the key away. Once the repository settings hold
  # the secrets in this environment, with a required reviewer and deployments
  # limited to main and v* tags, this job waits for that approval and a run from
  # another ref does not start it.
  sign:
    name: Sign release files
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-files-*
          path: release-files
          merge-multiple: true

      - name: Install the Tauri CLI
        working-directory: scripts/release-signer
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Each signature names the version, the way tauri build's own signing does,
      # and every file gets one: installers, updater archives and SHA256SUMS.
      - name: Sign every release file
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          signer="$PWD/scripts/release-signer/node_modules/.bin/tauri"
          cd release-files
          sha256sum -- * > SHA256SUMS
          for file in *; do
            "$signer" signer sign --app-version "$VERSION" "./$file"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signatures
          path: |
            release-files/*.sig
            release-files/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish release
    needs: [prepare, build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the files, take the release out of draft
      id-token: write # attest build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-files-*
          path: release-files
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signatures
          path: release-files

      # Every installer kind present exactly once, every file signed by the key in
      # tauri.conf.json for this version, SHA256SUMS matching the files. Anything
      # else stops the release in draft. latest.json is written from the signatures
      # that passed, so a key the app would refuse cannot be published.
      - name: Check every file and signature, write latest.json
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
        run: node scripts/release-files.mjs check release-files src-tauri/tauri.conf.json "$VERSION" "$GH_REPO"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-files/*

      - name: Upload the files to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v$VERSION" release-files/* --clobber

      # What the draft holds must be exactly what was checked above, by name and by
      # GitHub's own sha256 digest. A stray or half-uploaded asset stops it here.
      - name: Compare the draft with the checked files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | [.name, (.digest // ""), .state] | @tsv' > release-assets.tsv
          node scripts/release-files.mjs compare release-files release-assets.tsv

      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false
