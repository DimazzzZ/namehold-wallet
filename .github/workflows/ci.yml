name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck · build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs `tsc -b` (typecheck) then `vite build` (bundle) — fails on
      # a type error or a broken build.
      - name: Typecheck + build
        run: pnpm build

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Lint secure window imports
        run: pnpm lint:secure-imports

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    # sccache + mold + trimmed debuginfo. sccache caches compiled objects keyed
    # by input hash, so even a Swatinem miss (or any clippy/test residual
    # duplicate compile) hits sccache instead of paying full rustc time.
    # mold is a much faster linker than the default ld; noticeable on Tauri's
    # heavy dep graph where many crates re-link. line-tables-only debuginfo
    # trims ~hundreds of MB from target/ (faster codegen, smaller cache).
    # CARGO_INCREMENTAL is already 0 (Swatinem sets it) — required for sccache.
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 links webkit2gtk on Linux, so the crate must compile against the
      # system GUI libraries even just to run `cargo test`.
      # Cached via `awalsh128/cache-apt-pkgs-action` — a warm cache restores the
      # resolved .deb closure with dpkg (no mirror fetch), so a slow apt mirror
      # can't stall CI. Bump `version` below to bust the cache after editing the
      # package list.
      # Refresh the apt index first: the runner image ships a pre-seeded index
      # that the action treats as "fresh" and won't refresh, so on a cache MISS
      # it can try to fetch a superseded .deb version and 404. An explicit update
      # keeps the index in sync with the mirror pool; it's a no-op cost on a hit.
      - name: Refresh apt package index
        run: sudo apt-get update
      - name: Install Tauri system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            libsecret-1-dev
            patchelf
            build-essential
            libssl-dev
            mold
          # v2: v1 cached a half-installed set from a run where a stale-index
          # 404 dropped the gstreamer deps, breaking the GTK/webkit link. Bump
          # busts that poisoned cache; the apt refresh above prevents recurrence.
          version: "2"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: mozilla/sccache-action@v0.0.7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Required gate. Runs AFTER clippy so the dep-check artifacts are reused
      # and only the test-binary codegen is new. The env-gated live-node
      # integration tests skip automatically (no HNS_IT_NODE_URL set), so this
      # stays fast and offline.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  audit:
    name: Dependency audit (cargo audit · pnpm audit)
    runs-on: ubuntu-latest
    # Advisory-only — a new CVE in the transitive graph should surface here
    # without blocking unrelated PRs. Promote to required once the security
    # backlog is drained.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # --- pnpm audit (frontend) ---
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm audit` exits non-zero when advisories are found. `--audit-level
      # moderate` ignores low-severity noise. `--prod` limits the scan to the
      # runtime graph (dev-only deps like vitest/jsdom aren't shipped).
      # Advisories reviewed as not-applicable are suppressed via
      # `pnpm.auditConfig.ignoreGhsas` in pnpm-workspace.yaml and justified in
      # SECURITY.md ("Suppressed advisories"). A NEW advisory will still fail
      # this step (surfaced as a non-blocking warning via `continue-on-error`).
      - name: pnpm audit
        run: pnpm audit --audit-level moderate --prod

      # --- cargo audit (backend) ---
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Scans Cargo.lock against the RustSec advisory database. `--deny warnings`
      # fails on any advisory (informational or vulnerability).
      - name: cargo audit
        run: cargo audit --deny warnings
        working-directory: src-tauri
