name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck · build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs `tsc -b` (typecheck) then `vite build` (bundle) — fails on
      # a type error or a broken build.
      - name: Typecheck + build
        run: pnpm build

      - name: Unit tests
        run: pnpm exec vitest run

  rust:
    name: Rust (cargo test · fmt · clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 links webkit2gtk on Linux, so the crate must compile against the
      # system GUI libraries even just to run `cargo test`.
      # Cached via `awalsh128/cache-apt-pkgs-action` — a warm cache restores the
      # resolved .deb closure with dpkg (no mirror fetch), so a slow apt mirror
      # can't stall CI. Bump `version` below to bust the cache after editing the
      # package list.
      # Refresh the apt index first: the runner image ships a pre-seeded index
      # that the action treats as "fresh" and won't refresh, so on a cache MISS
      # it can try to fetch a superseded .deb version and 404. An explicit update
      # keeps the index in sync with the mirror pool; it's a no-op cost on a hit.
      - name: Refresh apt package index
        run: sudo apt-get update
      - name: Install Tauri system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            libsecret-1-dev
            patchelf
            build-essential
            libssl-dev
          # v2: v1 cached a half-installed set from a run where a stale-index
          # 404 dropped the gstreamer deps, breaking the GTK/webkit link. Bump
          # busts that poisoned cache; the apt refresh above prevents recurrence.
          version: "2"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Required gate. The env-gated live-node integration tests skip automatically
      # (no HNS_IT_NODE_URL set), so this stays fast and offline.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # Style + lint gates (required). The crate is formatted (`cargo fmt`) and
      # clean under `-- -D warnings`; scoped `#[allow(clippy::...)]` attributes
      # document the few structural lints (too_many_arguments on Tauri commands,
      # doc_overindented_list_items on prose-heavy module docs). Any regression
      # here fails CI.
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
