name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck · build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs `tsc -b` (typecheck) then `vite build` (bundle) — fails on
      # a type error or a broken build.
      - name: Typecheck + build
        run: pnpm build

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Lint secure window imports
        run: pnpm lint:secure-imports

      - name: Lint native title attributes
        run: pnpm lint:native-title

      - name: Format check
        run: pnpm lint:format

  rust-lint:
    name: Rust lint (fmt · clippy)
    runs-on: ubuntu-latest
    # A single flaky apt mirror or a stuck runner step must not eat a 6-hour
    # slot — bound the whole job so a hang fails fast and can be re-run.
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # Post-startup ghac IO errors fall back to a direct compile instead of
      # aborting the build. Does NOT cover startup-time backend outages — the
      # "Verify sccache backend" step below handles that (see sccache#1751).
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `apt-get update` occasionally hangs on an unreachable/throttled Ubuntu
      # mirror on GitHub-hosted runners (observed on run 32168132022: this step
      # hung 24+ min while the sibling rust-test job on a healthy runner passed
      # in 4m9s; and run 32273872139: rust-lint timed out here while rust-test
      # fetched the same 11 MB index in 54s on a healthier mirror). Bound it and
      # retry — mirror blips are transient.
      # Each attempt is capped at 120s via `timeout(1)` so a hung TCP fetch
      # returns a non-zero exit (124) and the loop moves on, instead of letting
      # apt sit on a half-open connection for the entire step budget. The
      # step-level `timeout-minutes: 3` is a backstop for pathological cases.
      #
      # Crucially, this step is BEST-EFFORT (no `exit 1`): its only purpose is
      # to feed the cached-install step below. On a cache HIT (the common path)
      # cache-apt-pkgs-action restores the fileset from the GHA cache and never
      # touches an apt mirror, so a slow mirror here is irrelevant. On a cache
      # MISS with a stale index, the install step surfaces the failure itself
      # (a 404) — so continuing past a failed update costs nothing and stops a
      # throttled mirror from flaking an otherwise-green job.
      - name: Refresh apt package index
        timeout-minutes: 3
        run: |
          set +e
          for i in 1 2 3; do
            sudo timeout 120 apt-get update && exit 0
            echo "::warning::apt-get update failed (attempt $i) — retrying in 5s"
            sleep 5
          done
          echo "::warning::apt-get update failed after 3 attempts — proceeding with stale index (cache-hit path is unaffected)"
      - name: Install Tauri system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            libsecret-1-dev
            libudev-dev
            patchelf
            build-essential
            libssl-dev
            mold
          version: "3"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head on 2026-10-16 (no version tags)
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: mozilla/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          # An exact sccache release: without it the action downloads whatever
          # release is newest on the day, and that binary wraps every rustc call.
          version: v0.18.0

      # If the GitHub Actions Cache backend is unavailable, sccache's server
      # fails to start and — because it's RUSTC_WRAPPER — hard-fails the whole
      # job before any crate compiles (observed on run 31117601637: ghac
      # returned HTTP 400). Probe startup here; if it fails, unset the wrapper
      # so cargo compiles directly. mold + Swatinem still apply, so the run
      # stays fast and, crucially, green. This does NOT mask clippy/test
      # failures — those steps keep their normal non-zero-exit gating.
      - name: Verify sccache backend (degrade gracefully if ghac is down)
        run: |
          if ! sccache --start-server 2>/tmp/sccache_start.log; then
            echo "::warning::sccache failed to start (ghac backend likely unavailable) — disabling compiler cache for this run"
            cat /tmp/sccache_start.log || true
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    # A single flaky apt mirror or a stuck runner step must not eat a 6-hour
    # slot — bound the whole job so a hang fails fast and can be re-run.
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # Post-startup ghac IO errors fall back to a direct compile instead of
      # aborting the build. Does NOT cover startup-time backend outages — the
      # "Verify sccache backend" step below handles that (see sccache#1751).
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `apt-get update` occasionally hangs on an unreachable/throttled Ubuntu
      # mirror on GitHub-hosted runners (observed on run 32168132022: the
      # sibling rust-lint job hung 24+ min on this exact step). Bound it and
      # retry — mirror blips are transient.
      # Each attempt is capped at 120s via `timeout(1)` so a hung TCP fetch
      # returns a non-zero exit (124) and the loop moves on, instead of letting
      # apt sit on a half-open connection for the entire step budget. The
      # step-level `timeout-minutes: 3` is a backstop for pathological cases.
      #
      # Best-effort by design (no `exit 1`): see rust-lint job above for the
      # full rationale — the cached-install step is the actual gate, and it
      # tolerates a stale index on the cache-hit path.
      - name: Refresh apt package index
        timeout-minutes: 3
        run: |
          set +e
          for i in 1 2 3; do
            sudo timeout 120 apt-get update && exit 0
            echo "::warning::apt-get update failed (attempt $i) — retrying in 5s"
            sleep 5
          done
          echo "::warning::apt-get update failed after 3 attempts — proceeding with stale index (cache-hit path is unaffected)"
      - name: Install Tauri system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            libsecret-1-dev
            libudev-dev
            patchelf
            build-essential
            libssl-dev
            mold
          version: "3"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head on 2026-10-16 (no version tags)
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: mozilla/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          # An exact sccache release: without it the action downloads whatever
          # release is newest on the day, and that binary wraps every rustc call.
          version: v0.18.0

      # If the GitHub Actions Cache backend is unavailable, sccache's server
      # fails to start and — because it's RUSTC_WRAPPER — hard-fails the whole
      # job before any crate compiles (observed on run 31117601637: ghac
      # returned HTTP 400). Probe startup here; if it fails, unset the wrapper
      # so cargo compiles directly. mold + Swatinem still apply, so the run
      # stays fast and, crucially, green. This does NOT mask clippy/test
      # failures — those steps keep their normal non-zero-exit gating.
      - name: Verify sccache backend (degrade gracefully if ghac is down)
        run: |
          if ! sccache --start-server 2>/tmp/sccache_start.log; then
            echo "::warning::sccache failed to start (ghac backend likely unavailable) — disabling compiler cache for this run"
            cat /tmp/sccache_start.log || true
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: rust-ci

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          # An exact version from the action's manifest, which carries its
          # checksum. fallback: none fails on a version missing from the manifest
          # instead of installing it through cargo-binstall without that checksum.
          tool: cargo-nextest@0.9.148
          fallback: none

      # Required gate. Runs tests in parallel across all cores (ubuntu-latest = 4 vCPU).
      # The env-gated live-node integration tests skip automatically (no HNS_IT_NODE_URL set),
      # so this stays fast and offline.
      #
      # Two-lane split (see src-tauri/.config/nextest.toml for the rationale):
      #   - pull_request → fast lane: skip any tests flagged in the `slow`
      #     filter expression below. Currently empty (every test is fast after
      #     the 2026-08 speed pass), but the machinery is ready to detach a
      #     future irreducibly-slow test with a one-line change.
      #   - push to main → full lane (`ci-full` profile): runs absolutely
      #     everything, after the merge, so it cannot stop that merge. The prepare
      #     job of release.yml reads this job's result: a release needs it green
      #     on the commit it builds (scripts/release-gate.mjs).
      - name: Test (nextest — fast lane, PRs)
        if: github.event_name == 'pull_request'
        # Keep the `-E` filter expression in sync with the `slow` filterset
        # documented in .config/nextest.toml. `test(/^$/)` matches nothing, so
        # today the fast lane runs everything; replace with a real filter (e.g.
        # `test(/legacy_nhv1_blob_decrypts/) | test(/some_other_slow/)`) if a
        # future test genuinely needs to be detached.
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --locked -E 'not test(/^$/)'

      - name: Test (nextest — full lane, main)
        if: github.event_name != 'pull_request'
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --locked --profile ci-full

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  audit:
    name: Dependency audit (cargo audit · pnpm audit)
    runs-on: ubuntu-latest
    # Advisory-only — a new CVE in the transitive graph should surface here
    # without blocking unrelated PRs. Promote to required once the security
    # backlog is drained.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --- pnpm audit (frontend) ---
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm audit` exits non-zero when advisories are found. `--audit-level
      # moderate` ignores low-severity noise. `--prod` limits the scan to the
      # runtime graph (dev-only deps like vitest/jsdom aren't shipped).
      # Advisories reviewed as not-applicable are suppressed via
      # `pnpm.auditConfig.ignoreGhsas` in pnpm-workspace.yaml and justified in
      # SECURITY.md ("Suppressed advisories"). A NEW advisory will still fail
      # this step (surfaced as a non-blocking warning via `continue-on-error`).
      - name: pnpm audit
        run: pnpm audit --audit-level moderate --prod

      # --- cargo audit (backend) ---
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head on 2026-10-16 (no version tags)
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      # Scans Cargo.lock against the RustSec advisory database. `--deny warnings`
      # fails on any advisory (informational or vulnerability).
      - name: cargo audit
        run: cargo audit --deny warnings
        working-directory: src-tauri
