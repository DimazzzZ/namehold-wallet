name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests (Tauri App)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      # The E2E build dominates the job (~350s of ~430s). Switch to the debug
      # profile (opt-level=0, no LTO, incremental enabled) for a ~3–5× speedup
      # over release. Smoke tests (title/visibility/window-size) pass identically
      # on debug binaries. The sidecar also builds in debug (via SIDECAR_PROFILE)
      # so we don't waste ~20–50s on release codegen+link for a binary the tests
      # never even launch.
      SIDECAR_PROFILE: debug
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Bound the apt index refresh and retry — mirror blips on GitHub-hosted
      # runners are transient. Best-effort (no `exit 1`): the cached-install
      # step below is the actual gate and tolerates a stale index on cache-hit.
      - name: Refresh apt package index
        timeout-minutes: 3
        run: |
          set +e
          for i in 1 2 3; do
            sudo timeout 120 apt-get update && exit 0
            echo "::warning::apt-get update failed (attempt $i) — retrying in 5s"
            sleep 5
          done
          echo "::warning::apt-get update failed after 3 attempts — proceeding with stale index"

      # Same Tauri build deps as ci.yml / release.yml, plus the two packages
      # needed to drive the built app headlessly under WebDriver:
      #   - webkit2gtk-driver: provides WebKitWebDriver, which tauri-driver wraps
      #   - xvfb: virtual framebuffer so the GTK/WebKit window has a display
      #   - gsettings-desktop-schemas + dbus-x11: WebKit's network process reads
      #     the org.gnome.system.proxy GSettings schema on startup. Without the
      #     schema, GLib raises a FATAL GLib-GIO-ERROR and aborts that process,
      #     which kills the WebView and makes tauri-driver's session handshake
      #     fail with "connection closed" / UND_ERR_SOCKET. dbus-x11 provides a
      #     session bus so the a11y/dbus lookups don't wedge either.
      - name: Install Tauri system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            libsecret-1-dev
            libudev-dev
            patchelf
            build-essential
            libssl-dev
            mold
            webkit2gtk-driver
            xvfb
            gsettings-desktop-schemas
            dbus-x11
          version: "3"

      # awalsh128/cache-apt-pkgs-action restores packages by extracting cached
      # .debs and does NOT re-run dpkg post-install triggers. gsettings-desktop-
      # schemas ships raw *.gschema.xml that must be compiled into
      # /usr/share/glib-2.0/schemas/gschemas.compiled by glib-compile-schemas —
      # a dpkg trigger that only fires on a real install (cache miss). On a cache
      # HIT the compiled file is absent, so org.gnome.system.proxy reads as "not
      # installed" and WebKit aborts with a fatal GLib-GIO-ERROR. Compile the
      # schemas explicitly so the result is identical on hit and miss.
      - name: Compile GSettings schemas
        run: |
          sudo glib-compile-schemas /usr/share/glib-2.0/schemas
          # Sanity check the schema WebKit needs is now present.
          gsettings list-schemas | grep -q '^org.gnome.system.proxy$' \
            && echo "org.gnome.system.proxy present" \
            || (echo "::error::org.gnome.system.proxy still missing after compile" && exit 1)

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla/sccache-action@v0.0.11

      # If the GHA cache backend is down, sccache (as RUSTC_WRAPPER) hard-fails
      # the job before any crate compiles. Probe startup; on failure, unset the
      # wrapper so cargo compiles directly (mold + Swatinem still apply).
      - name: Verify sccache backend (degrade gracefully if ghac is down)
        run: |
          if ! sccache --start-server 2>/tmp/sccache_start.log; then
            echo "::warning::sccache failed to start — disabling compiler cache for this run"
            cat /tmp/sccache_start.log || true
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          # Bumped when switching from release to debug profile: cargo
          # fingerprints the profile, so the old cache would miss on every crate.
          # Start a clean namespace.
          shared-key: rust-e2e-debug

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Build only the debug executable the WebDriver launches. `--debug` picks
      # the dev profile (opt-level=0, incremental) — ~3–5× faster to compile
      # than release and identical from WebDriver's perspective. `--no-bundle`
      # skips .deb/.rpm/.AppImage packaging and the updater-signing step (the
      # app enables createUpdaterArtifacts, which otherwise fails here without
      # TAURI_SIGNING_PRIVATE_KEY). E2E drives the raw binary, not a bundle.
      - name: Build Tauri app
        run: pnpm tauri build --debug --no-bundle

      # --ignore-workspace: don't attach to the repo-root pnpm workspace (which
      #   would install nothing here and leave wdio missing).
      # --ignore-scripts: skip dependency postinstall build scripts. pnpm v11
      #   otherwise fails the install with ERR_PNPM_IGNORED_BUILDS when a dep
      #   (esbuild, edgedriver, geckodriver) has an unapproved build script.
      #   E2E only needs the JS entrypoints — tsx/wdio run fine without them,
      #   and the unused browser drivers are irrelevant (we drive Tauri via
      #   tauri-driver + WebKitWebDriver).
      # --config.minimum-release-age=0: skip pnpm v11's default 24h supply-chain
      #   hold for this never-shipped test tooling (a freshly published
      #   transitive like jszip would otherwise block CI).
      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts --config.minimum-release-age=0
        working-directory: e2e

      # tauri-driver is a Cargo binary (not an npm package). It starts the
      # WebDriver server on :4444 and spawns WebKitWebDriver under the hood.
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # Start a virtual display, then tauri-driver (which spawns WebKitWebDriver
      # and, per session, the app window — all on $DISPLAY). WDIO only talks HTTP
      # to the driver on :4444, so the test process itself needs no display.
      - name: Run E2E tests
        working-directory: e2e
        timeout-minutes: 20
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2
          # Run the driver + tests under a private D-Bus session bus. WebKit's
          # network process and the a11y stack look up a session bus on startup;
          # without one (plus the org.gnome.system.proxy schema installed above)
          # the WebView process aborts and the WebDriver session can't be created.
          run_e2e() {
            tauri-driver >/tmp/tauri-driver.log 2>&1 &
            DRIVER_PID=$!
            for i in $(seq 1 15); do
              if curl -sf http://localhost:4444/status >/dev/null 2>&1; then
                echo "tauri-driver ready"
                break
              fi
              sleep 1
            done
            set +e
            pnpm test
            local status=$?
            set -e
            kill "$DRIVER_PID" 2>/dev/null || true
            return $status
          }
          export -f run_e2e
          set +e
          dbus-run-session -- bash -c run_e2e
          STATUS=$?
          set -e
          kill "$XVFB_PID" 2>/dev/null || true
          exit $STATUS

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            e2e/logs/
            /tmp/tauri-driver.log
            /tmp/xvfb.log
          retention-days: 7
