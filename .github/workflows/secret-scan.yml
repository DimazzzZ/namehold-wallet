name: Secret scan

# On its own, on every branch and tag: a build that fails or a job that waits
# cannot delay it. It needs nothing installed. This only shortens the time until
# a published secret is noticed; the git hooks are what stop one being published.
on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: No wallet secrets (recovery phrases, private keys)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits pushed, and the merge base of a new branch
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Scan the tree
        run: node scripts/check-secrets.mjs

      # Also what the tree no longer shows: a phrase added and removed again.
      - name: Scan the commits pushed
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-secrets.mjs --range "$BEFORE" "$GITHUB_SHA" origin/main

      - name: Test the scanner
        run: node --test scripts/check-secrets.node-test.mjs
