[package]
name = "namehold-wallet"
version = "0.4.1"
edition = "2021"
default-run = "namehold-wallet"

[lib]
name = "namehold_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "namehold-syncd"
path = "src/bin/namehold-syncd.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
# Only new dependency for I1 (OS notifications + deadline scanner).
tauri-plugin-notification = "2"
# Auto-updater (desktop only) — checks GitHub Releases for latest.json.
tauri-plugin-updater = "2"
# Process plugin — enables `app.restart()` from the frontend after an update.
tauri-plugin-process = "2"
# Opener plugin — opens external URLs (e.g. explorer tx links) in the system
# browser; the Tauri webview otherwise blocks external navigation.
tauri-plugin-opener = "2"
# System-tray "Launch at login" toggle (macOS LaunchAgent, Windows Run key,
# Linux .desktop autostart).
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
dirs = "6"
# Signal handler for daemon graceful shutdown (SIGINT/SIGTERM on Unix,
# console/close events on Windows). Used only by the `namehold-syncd` binary
# but declared as a normal dep so it's built with the main workspace.
ctrlc = "3"
libc = "0.2"
# OS notifications from the headless `namehold-syncd` daemon (which has no
# Tauri AppHandle, so it can't use tauri-plugin-notification). Cross-platform:
# macOS (mac-notification-sys), Linux (libnotify/D-Bus), Windows (winrt toast).
notify-rust = "4"

# --- Non-custodial signing engine ---
# secp256k1 for ECDSA signing on the Handshake curve.
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }
# BIP39 mnemonic <-> seed.
bip39 = "2"
# Hashing primitives used across HD derivation, address encoding, and sighash.
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
blake2 = "0.10"
# Bech32 for Handshake (hs1...) address encoding.
bech32 = "0.11"
# Secret-at-rest encryption.
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
# Zeroize secrets in memory.
zeroize = { version = "1", features = ["derive"] }
# base64 encoding for hsd-compatible signed-message output (signmessagewithname parity).
base64 = "0.22"
url = "2.5.8"
# Parallel iterator for brute-force bid-value recovery (Tier-2 full sweep).
rayon = "1.10"

# --- Ledger hardware wallet support ---
# HID transport for Ledger Nano S/X (vendorId 0x2C97). Mature cross-platform
# crate; we hand-roll the Ledger 0x0101/0x05 framing on top. Only the official
# `handshake-org/ledger-app-hns` device firmware is supported (dev-mode
# sideload). See src/providers/ledger/ for the APDU implementation.
hidapi = "2"

# OS keyring for the Namebase-cookie data-encryption key. v3 ships no backend
# by default — pick the native store per OS. Linux uses the Secret Service
# (org.freedesktop.secrets, e.g. gnome-keyring / KWallet) with the pure-Rust
# crypto backend so there is no OpenSSL build dependency; it still needs the
# `libsecret` runtime lib.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
mockito = "1"
# Enables tauri::test (mock_builder/mock_context) so integration tests can drive
# the real #[tauri::command] functions with managed AppState.
tauri = { version = "2", features = ["test"] }

# Release build hardening. Stripping symbols reduces the binary size and makes
# reverse-engineering slightly harder; `panic = "abort"` avoids unwind tables
# (also shrinks the binary); `lto = "thin"` gives cross-crate inlining without
# the long compile times of `lto = "fat"`. Codegen units of 1 maximises
# optimisation opportunities at the cost of longer release builds — acceptable
# for a wallet where releases are infrequent. Debug info is dropped entirely.
[profile.release]
strip = "symbols"
panic = "abort"
lto = "thin"
codegen-units = 1
debug = false
