[package]
name = "namehold-wallet"
version = "0.3.0"
edition = "2021"
default-run = "namehold-wallet"

[lib]
name = "namehold_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "namehold-syncd"
path = "src/bin/namehold-syncd.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
# Only new dependency for I1 (OS notifications + deadline scanner).
tauri-plugin-notification = "2"
# Auto-updater (desktop only) — checks GitHub Releases for latest.json.
tauri-plugin-updater = "2"
# Process plugin — enables `app.restart()` from the frontend after an update.
tauri-plugin-process = "2"
# Opener plugin — opens external URLs (e.g. explorer tx links) in the system
# browser; the Tauri webview otherwise blocks external navigation.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
dirs = "6"
# Signal handler for daemon graceful shutdown (SIGINT/SIGTERM on Unix,
# console/close events on Windows). Used only by the `namehold-syncd` binary
# but declared as a normal dep so it's built with the main workspace.
ctrlc = "3"
libc = "0.2"

# --- Non-custodial signing engine ---
# secp256k1 for ECDSA signing on the Handshake curve.
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }
# BIP39 mnemonic <-> seed.
bip39 = "2"
# Hashing primitives used across HD derivation, address encoding, and sighash.
hmac = "0.12"
sha2 = "0.10"
ripemd = "0.1"
blake2 = "0.10"
# Bech32 for Handshake (hs1...) address encoding.
bech32 = "0.11"
# Secret-at-rest encryption.
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
# Zeroize secrets in memory.
zeroize = { version = "1", features = ["derive"] }
# base64 encoding for hsrd-compatible signed-message output (signmessagewithname parity).
base64 = "0.22"
url = "2.5.8"

# --- Canonical Handshake protocol implementation (hns-rs) ---
# Keep the transaction, covenant, script, swap, and marketplace layers on one
# immutable revision so wire formats cannot drift independently.
hns-primitives = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "15f715576a2111fae2a8c65fccc7860ede64bd98" }
hns-transaction = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "15f715576a2111fae2a8c65fccc7860ede64bd98" }
hns-covenants = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "15f715576a2111fae2a8c65fccc7860ede64bd98" }
hns-script = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "15f715576a2111fae2a8c65fccc7860ede64bd98" }
hns-swap = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "15f715576a2111fae2a8c65fccc7860ede64bd98" }
hns-marketplace-protocol = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "15f715576a2111fae2a8c65fccc7860ede64bd98" }
hns-urkel-proof = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "15f715576a2111fae2a8c65fccc7860ede64bd98" }

# OS keyring for the Namebase-cookie data-encryption key. v3 ships no backend
# by default — pick the native store per OS. Linux uses the Secret Service
# (org.freedesktop.secrets, e.g. gnome-keyring / KWallet) with the pure-Rust
# crypto backend so there is no OpenSSL build dependency; it still needs the
# `libsecret` runtime lib.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
mockito = "1"
# Enables tauri::test (mock_builder/mock_context) so integration tests can drive
# the real #[tauri::command] functions with managed AppState.
tauri = { version = "2", features = ["test"] }

# Release build hardening. Stripping symbols reduces the binary size and makes
# reverse-engineering slightly harder; `panic = "abort"` avoids unwind tables
# (also shrinks the binary); `lto = "thin"` gives cross-crate inlining without
# the long compile times of `lto = "fat"`. Codegen units of 1 maximises
# optimisation opportunities at the cost of longer release builds — acceptable
# for a wallet where releases are infrequent. Debug info is dropped entirely.
[profile.release]
strip = "symbols"
panic = "abort"
lto = "thin"
codegen-units = 1
debug = false
