# Marks e2e/ as its own pnpm workspace root so `pnpm install` here does NOT
# walk up and attach to the repo-root workspace (which would install nothing
# and leave wdio missing). This is also where pnpm v11 reads the build-script
# and supply-chain settings below — the `pnpm` field in package.json is no
# longer honored.

# tsx needs esbuild's platform binary, installed by its postinstall script.
onlyBuiltDependencies:
  - esbuild

# Shipped in webdriverio's driver bundle but unused here (E2E drives Tauri via
# tauri-driver + WebKitWebDriver). Listing them keeps pnpm v11 from failing on
# their skipped build scripts.
ignoredBuiltDependencies:
  - edgedriver
  - geckodriver

# E2E test tooling is never shipped, so don't apply the default 24h hold on
# freshly-published transitives (e.g. jszip). The app graph at the repo root
# keeps the default policy.
minimumReleaseAge: 0
